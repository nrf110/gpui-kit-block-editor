[package]
name = "gpui-kit-markdown-editor"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wabzqem/gpui-kit-markdown-editor"
description = "GPUI native editor with a structured-document bridge"

[lib]
name = "markdown_editor"
path = "src/lib.rs"
doctest = false

[features]
default = ["syntect"]
syntect = ["gpui-kit/syntect"]
tree-sitter = ["gpui-kit/tree-sitter", "gpui-kit/tree-sitter-languages"]

[dependencies]
gpui-kit = "0.10"
markdown = "1.0.0"
unicode-segmentation = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow = "1"
gpui-kit = { version = "0.10", features = ["test-support"] }
