[package]
name = "gpui-kit-block-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Collaborative block markdown editor for GPUI Kit"

[dependencies]
anyhow = "1"
gpui-kit = "0.10.0"
markdown_editor = { package = "gpui-kit-markdown-editor", version = "0.3.0", default-features = false }
yrs = "0.28.1"
uuid = { version = "1", features = ["v4"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
markdown = "1.0.0"
similar = "2"
unicode-segmentation = "1"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false
