[package]
name = "gpui-kit-block-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Collaborative native rich-text block editor for GPUI Kit"
include = [
    "/src/**",
    "/assets/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/rust-toolchain.toml",
]

[dependencies]
anyhow = "1"
gpui-kit = { version = "0.10.0", features = ["syntect"] }
yrs = "0.28.1"
uuid = { version = "1", features = ["v4"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
markdown = "1.0.0"
similar = "2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false
